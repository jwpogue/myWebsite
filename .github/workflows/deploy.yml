name: Deploy

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without pushing.
  workflow_dispatch:

# Only one deploy at a time; a newer push should win rather than queue.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        # Project sites are served from /<repo>/, so assets need that prefix.
        # When the custom domain is live: delete this env block and add a
        # public/CNAME file containing the domain.
        env:
          VITE_BASE: /myWebsite/
        run: npm run build

      - name: Add SPA fallback
        # GitHub Pages has no rewrite rules. Serving the app shell as the 404
        # page means deep links like /projects still boot the router.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
